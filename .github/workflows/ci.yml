name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:dom

  schema:
    name: Migration drift
    runs-on: ubuntu-latest
    # The Prisma CLI talks to Postgres directly, so any container with the
    # right extensions is fine here — only the application uses the Neon
    # driver adapter. pgvector/pgvector:pg17 is stock postgres:17 plus the
    # `vector` extension pre-installed (not pre-created — the Phase-5
    # pgvector migration still runs `CREATE EXTENSION IF NOT EXISTS vector`),
    # which the Phase-5 migrations need to replay cleanly. See
    # prisma/migrations/20260807020000_phase5_pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Exits non-zero when schema.prisma and the committed migrations have
      # diverged, i.e. someone edited the schema without generating a migration.
      - run: npm run db:validate

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # src/lib/db.ts throws at module load without this. Every route is
          # force-dynamic, so nothing connects during the build.
          DATABASE_URL: postgresql://build:build@localhost:5432/build
