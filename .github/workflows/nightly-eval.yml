name: Nightly eval

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  eval:
    name: Extraction and quality-judge eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run eval:extraction
      # The live-judge half of eval:quality self-skips without ZAI_API_KEY
      # (see tests/eval/quality-judge.eval.test.ts) rather than failing —
      # same "skip, don't fail red, when unconfigured" posture as
      # db-branch.yml's Neon secrets check.
      - run: npm run eval:quality
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
