name: Nightly eval

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  eval:
    name: Extraction eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run eval:extraction
